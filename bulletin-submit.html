<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Local Crux — Submit to the Bulletin</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 24px 96px;
    line-height: 1.6;
    color: #1c1c1e;
    background: #fefaf5;
  }
  h1 { color: #c15321; margin-bottom: 4px; }
  .meta { color: #6b6b6b; margin-top: 0; margin-bottom: 32px; }
  a { color: #c15321; }
  .back { display: inline-block; margin-bottom: 32px; }
  label { display: block; font-weight: 600; margin: 20px 0 6px; }
  label .optional { font-weight: 400; color: #6b6b6b; }
  input[type="text"], input[type="email"], input[type="url"], textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid #d8cfc2;
    border-radius: 8px;
    font-size: 1em;
    font-family: inherit;
    background: #fff;
    color: #1c1c1e;
  }
  textarea { min-height: 120px; resize: vertical; }
  .honeypot { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .cf-turnstile { margin-top: 24px; }
  button {
    margin-top: 24px;
    background: #c15321;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .status { margin-top: 16px; font-size: 0.95em; }
  .status.error { color: #b3261e; }
  .status.success { color: #1a7a3a; }
</style>
</head>
<body>
  <a class="back" href="index.html">&larr; Back to Support</a>
  <h1>Submit to the Bulletin</h1>
  <p class="meta">Gym or brand deals, events, and meetups relevant to climbers. Every submission is reviewed before it goes live — nothing posts automatically.</p>

  <form id="bulletin-form">
    <label for="sponsor_name">Your name / gym / brand</label>
    <input type="text" id="sponsor_name" name="sponsor_name" required maxlength="200">

    <label for="contact_email">Contact email</label>
    <input type="email" id="contact_email" name="contact_email" required maxlength="320">

    <label for="title">Title</label>
    <input type="text" id="title" name="title" required maxlength="200" placeholder="e.g. New route set this weekend">

    <label for="body">Details</label>
    <textarea id="body" name="body" required maxlength="4000"></textarea>

    <label for="link_url">Link <span class="optional">(optional — event page, website, etc.)</span></label>
    <input type="url" id="link_url" name="link_url" maxlength="2000" placeholder="https://">

    <label for="image_url">Image URL <span class="optional">(optional)</span></label>
    <input type="url" id="image_url" name="image_url" maxlength="2000" placeholder="https://">

    <div class="honeypot" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="cf-turnstile" data-sitekey="0x4AAAAAAEW5UgV8NWczo5ST" data-action="bulletin_submit"></div>

    <button type="submit" id="submit-button">Submit for review</button>
    <p id="status" class="status" role="status"></p>
  </form>

  <script>
    const ENDPOINT = "https://xioisuktsokyuupnobes.supabase.co/functions/v1/bulletin-submit-request";
    const form = document.getElementById("bulletin-form");
    const statusEl = document.getElementById("status");
    const submitButton = document.getElementById("submit-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "";
      statusEl.className = "status";

      const turnstileToken = form.querySelector('[name="cf-turnstile-response"]')?.value;
      if (!turnstileToken) {
        statusEl.textContent = "Please complete the verification check above.";
        statusEl.className = "status error";
        return;
      }

      submitButton.disabled = true;
      statusEl.textContent = "Submitting…";

      const body = {
        sponsor_name: form.sponsor_name.value.trim(),
        contact_email: form.contact_email.value.trim(),
        title: form.title.value.trim(),
        body: form.body.value.trim(),
        link_url: form.link_url.value.trim() || undefined,
        image_url: form.image_url.value.trim() || undefined,
        website: form.website.value,
        turnstile_token: turnstileToken,
      };

      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await response.json();
        if (!response.ok || !result.ok) {
          throw new Error(result.error || "Something went wrong.");
        }
        form.style.display = "none";
        statusEl.textContent = "Thanks — this has been sent for review. We'll be in touch if we need anything else.";
        statusEl.className = "status success";
      } catch (error) {
        statusEl.textContent = "Couldn't submit that: " + error.message + " You can also try again in a moment, or email Help@TheLocalCrux.com directly.";
        statusEl.className = "status error";
        submitButton.disabled = false;
        if (window.turnstile) {
          window.turnstile.reset();
        }
      }
    });
  </script>
</body>
</html>
