<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Local Crux — Submit to the Bulletin</title>
<meta name="description" content="Get a deal, event, or meetup in front of local climbers on The Local Crux Bulletin.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="The Local Crux">
        <picture>
          <source srcset="assets/logo-dark.png" media="(prefers-color-scheme: dark)">
          <img src="assets/logo-light.png" alt="The Local Crux">
        </picture>
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="support.html">Support</a>
        <a href="bulletin-submit.html" class="current">Bulletin</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap page-title">
      <h1>Submit to the Bulletin</h1>
      <p class="meta">Gym or brand deals, events, and meetups relevant to climbers. Every submission is reviewed before it goes live — nothing posts automatically.</p>
    </div>

    <div class="wrap">
      <div class="card">
        <form id="bulletin-form">
          <label for="sponsor_name">Your name / gym / brand</label>
          <input type="text" id="sponsor_name" name="sponsor_name" required maxlength="200">

          <label for="contact_email">Contact email</label>
          <input type="email" id="contact_email" name="contact_email" required maxlength="320">

          <label for="title">Title</label>
          <input type="text" id="title" name="title" required maxlength="200" placeholder="e.g. New route set this weekend">

          <label for="body">Details</label>
          <textarea id="body" name="body" required maxlength="4000"></textarea>

          <label for="link_url">Link <span class="optional">(optional — event page, website, etc.)</span></label>
          <input type="url" id="link_url" name="link_url" maxlength="2000" placeholder="https://">

          <label for="image_url">Image URL <span class="optional">(optional)</span></label>
          <input type="url" id="image_url" name="image_url" maxlength="2000" placeholder="https://">

          <div class="honeypot" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <div class="cf-turnstile" data-sitekey="0x4AAAAAAEW5UgV8NWczo5ST" data-action="bulletin_submit"></div>

          <button type="submit" id="submit-button" class="btn" style="margin-top: 20px;">Submit for review</button>
          <p id="status" class="status" role="status"></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="site">
    <div class="wrap">
      <div class="brand">
        <picture>
          <source srcset="assets/logo-dark.png" media="(prefers-color-scheme: dark)">
          <img src="assets/logo-light.png" alt="">
        </picture>
        <span>© The Local Crux</span>
      </div>
      <nav>
        <a href="mailto:Help@TheLocalCrux.com">Contact</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </div>
  </footer>

  <script>
    const ENDPOINT = "https://xioisuktsokyuupnobes.supabase.co/functions/v1/bulletin-submit-request";
    const form = document.getElementById("bulletin-form");
    const statusEl = document.getElementById("status");
    const submitButton = document.getElementById("submit-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "";
      statusEl.className = "status";

      const turnstileToken = form.querySelector('[name="cf-turnstile-response"]')?.value;
      if (!turnstileToken) {
        statusEl.textContent = "Please complete the verification check above.";
        statusEl.className = "status error";
        return;
      }

      submitButton.disabled = true;
      statusEl.textContent = "Submitting…";

      const body = {
        sponsor_name: form.sponsor_name.value.trim(),
        contact_email: form.contact_email.value.trim(),
        title: form.title.value.trim(),
        body: form.body.value.trim(),
        link_url: form.link_url.value.trim() || undefined,
        image_url: form.image_url.value.trim() || undefined,
        website: form.website.value,
        turnstile_token: turnstileToken,
      };

      try {
        const response = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const result = await response.json();
        if (!response.ok || !result.ok) {
          throw new Error(result.error || "Something went wrong.");
        }
        form.style.display = "none";
        statusEl.textContent = "Thanks — this has been sent for review. We'll be in touch if we need anything else.";
        statusEl.className = "status success";
      } catch (error) {
        statusEl.textContent = "Couldn't submit that: " + error.message + " You can also try again in a moment, or email Help@TheLocalCrux.com directly.";
        statusEl.className = "status error";
        submitButton.disabled = false;
        if (window.turnstile) {
          window.turnstile.reset();
        }
      }
    });
  </script>

  <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="thelocalcrux" data-description="Support me on Buy me a coffee!" data-message="" data-color="#C15321" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
</body>
</html>
