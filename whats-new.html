  <script>
    const SUPABASE_URL = "https://xioisuktsokyuupnobes.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_szx3egTPABoU3xKzowV3KA_W9XIk4cz";
    const notesWrap = document.getElementById("notes-wrap");
    const statusEl = document.getElementById("notes-status");

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(iso) {
      const date = new Date(iso);
      return date.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    }

    // Same shape scripts/notify_testers.py builds its email from, and
    // lib/screens/release_notes_screen.dart parses in-app: a paragraph
    // (blocks separated by a blank line) with no "- " line is a plain
    // sentence; one whose first line has no "- " but later lines do is a
    // header followed by bullets; one where every line starts with "- "
    // is bare bullets with no header.
    function renderNotesHtml(notes) {
      const paragraphs = notes.split("\n\n").map((p) => p.trim()).filter(Boolean);
      return paragraphs.map((paragraph) => {
        const lines = paragraph.split("\n");
        const hasBullets = lines.some((l) => l.trim().startsWith("- "));
        if (!hasBullets) {
          return `<p>${escapeHtml(paragraph)}</p>`;
        }
        const firstIsHeader = !lines[0].trim().startsWith("- ");
        const headerHtml = firstIsHeader ? `<h3>${escapeHtml(lines[0])}</h3>` : "";
        const bulletLines = firstIsHeader ? lines.slice(1) : lines;
        const itemsHtml = bulletLines
          .map((l) => l.trim())
          .filter((l) => l.startsWith("- "))
          .map((l) => `<li>${escapeHtml(l.slice(2))}</li>`)
          .join("");
        return `${headerHtml}<ul>${itemsHtml}</ul>`;
      }).join("");
    }

    fetch(SUPABASE_URL + "/rest/v1/release_notes?select=build,version,notes,published_at&order=build.desc", {
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: "Bearer " + SUPABASE_PUBLISHABLE_KEY,
      },
    })
      .then((response) => (response.ok ? response.json() : Promise.reject(response.status)))
      .then((rows) => {
        if (!Array.isArray(rows) || rows.length === 0) {
          statusEl.textContent = "No release notes yet.";
          return;
        }
        statusEl.remove();
        for (const row of rows) {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            `<strong>${escapeHtml(row.version)}</strong>` +
            `<p class="meta" style="margin-top: 2px;">${formatDate(row.published_at)}</p>` +
            renderNotesHtml(row.notes);
          notesWrap.appendChild(card);
        }
      })
      .catch(() => {
        statusEl.textContent = "Couldn't load release notes right now — try again shortly.";
      });
  </script>

  <script data-name="BMC-Widget" data-cfasync="false" src="https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js" data-id="thelocalcrux" data-description="Support me on Buy me a coffee!" data-message="" data-color="#C15321" data-position="Right" data-x_margin="18" data-y_margin="18"></script>
